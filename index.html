<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マインスイーパー カスタムグリッド＆ソルバーヒント</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.cell {
  width: 100%;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: clamp(10px, 1.5vw, 16px);
  cursor: pointer;
  border: 1px solid #374151;
  user-select: none;
  border-radius: 2px;
  transition: background 0.1s;
}
.cell-covered  { background:#4b5563; }
.cell-covered:hover { background:#6b7280; }
.cell-open     { background:#1f2937; }
.cell-mine     { background:#7f1d1d; }
.cell-flag     { background:#4b5563; }
.cell-hint     { background:#854d0e !important; outline:2px solid #fbbf24; }
.n1{color:#3b82f6} .n2{color:#22c55e} .n3{color:#ef4444}
.n4{color:#1e3a8a} .n5{color:#9f1239} .n6{color:#0e7490}
.n7{color:#7c3aed} .n8{color:#374151}
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-3">
<div class="max-w-2xl mx-auto">
  <h1 class="text-xl font-bold text-blue-400 mb-3 text-center">💣 マインスイーパー＋ヒント</h1>

  <div class="bg-gray-800 rounded-xl p-4 mb-3">
    <div class="flex flex-wrap gap-3 items-center mb-3">
      <div class="flex items-center gap-2">
        <label class="text-sm text-gray-400">グリッド:</label>
        <select id="gridSizeSelect"
          class="bg-gray-700 border border-gray-600 rounded px-2 py-1 text-white text-sm"
          aria-label="グリッドサイズ">
          <option value="9">9×9</option>
          <option value="16">16×16</option>
        </select>
      </div>
      <div class="flex items-center gap-2">
        <label class="text-sm text-gray-400">地雷数:</label>
        <input id="mineCount" type="number" value="10" min="1" max="40"
          class="w-16 bg-gray-700 border border-gray-600 rounded px-2 py-1 text-white text-sm"
          aria-label="地雷数">
      </div>
      <button onclick="newGame()"
        class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-4 py-1.5 rounded-lg text-sm"
        aria-label="新規ゲーム">🆕 新規ゲーム</button>
      <button onclick="showHint()"
        class="bg-yellow-600 hover:bg-yellow-500 text-black font-bold px-4 py-1.5 rounded-lg text-sm"
        aria-label="ヒントを表示">💡 ヒント</button>
    </div>

    <div class="flex gap-4 text-sm items-center">
      <span>⏱️ <span id="timerEl" class="font-mono text-orange-300">0</span>s</span>
      <span>💣 <span id="mineCounter" class="font-mono text-red-300">10</span></span>
      <span id="statusMsg" class="text-green-300 font-bold"></span>
    </div>
  </div>

  <div class="bg-gray-800 rounded-xl p-3 overflow-auto">
    <div id="gameGrid" style="display:grid; gap:2px;"></div>
  </div>

  <div class="mt-3 text-xs text-gray-500 text-center">
    左クリック: セルを開く ／ 右クリック: フラグ ／ 長押し（スマホ）: フラグ
  </div>
</div>

<script>
const NUM_COLORS = ['','n1','n2','n3','n4','n5','n6','n7','n8'];
let gridSize = 9, totalMines = 10;
let board = [], revealed = [], flagged = [], firstClick = true;
let gameOver = false, won = false;
let timerInterval = null, seconds = 0;
let hintCells = [];
let longPressTimer = null;

function newGame() {
  gridSize = parseInt(document.getElementById('gridSizeSelect').value);
  totalMines = Math.min(parseInt(document.getElementById('mineCount').value) || 10,
    gridSize * gridSize - 9);
  document.getElementById('mineCount').value = totalMines;

  board = Array.from({length:gridSize}, () => Array(gridSize).fill(0));
  revealed = Array.from({length:gridSize}, () => Array(gridSize).fill(false));
  flagged = Array.from({length:gridSize}, () => Array(gridSize).fill(false));
  firstClick = true;
  gameOver = false;
  won = false;
  hintCells = [];
  seconds = 0;
  clearInterval(timerInterval);
  document.getElementById('timerEl').textContent = '0';
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('mineCounter').textContent = totalMines;
  renderGrid();
}

function placeMines(safeRow, safeCol) {
  const safe = new Set();
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const r = safeRow+dr, c = safeCol+dc;
    if (r>=0&&r<gridSize&&c>=0&&c<gridSize) safe.add(r*gridSize+c);
  }
  safe.add(safeRow*gridSize+safeCol);

  let placed = 0;
  while (placed < totalMines) {
    const idx = Math.floor(Math.random()*gridSize*gridSize);
    const r = Math.floor(idx/gridSize), c = idx%gridSize;
    if (!safe.has(idx) && board[r][c] !== -1) {
      board[r][c] = -1;
      placed++;
    }
  }
  for (let r=0;r<gridSize;r++) for (let c=0;c<gridSize;c++) {
    if (board[r][c] !== -1) {
      let count = 0;
      for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) {
        const nr=r+dr,nc=c+dc;
        if (nr>=0&&nr<gridSize&&nc>=0&&nc<gridSize&&board[nr][nc]===-1) count++;
      }
      board[r][c] = count;
    }
  }
}

function renderGrid() {
  const grid = document.getElementById('gameGrid');
  const cellSize = gridSize === 9 ? '44px' : '30px';
  grid.style.gridTemplateColumns = `repeat(${gridSize}, ${cellSize})`;
  grid.innerHTML = '';

  for (let r=0;r<gridSize;r++) for (let c=0;c<gridSize;c++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const isHint = hintCells.some(([hr,hc]) => hr===r&&hc===c);

    if (flagged[r][c] && !revealed[r][c]) {
      cell.className += ' cell-flag';
      cell.textContent = '🚩';
    } else if (!revealed[r][c]) {
      cell.className += ' cell-covered' + (isHint ? ' cell-hint' : '');
    } else if (board[r][c] === -1) {
      cell.className += ' cell-mine';
      cell.textContent = '💣';
    } else {
      cell.className += ' cell-open';
      if (board[r][c] > 0) {
        cell.className += ' ' + NUM_COLORS[board[r][c]];
        cell.textContent = board[r][c];
      }
    }

    cell.style.width = cellSize;
    cell.style.height = cellSize;
    cell.style.fontSize = gridSize === 9 ? '16px' : '12px';

    const row = r, col = c;
    cell.addEventListener('click', () => openCell(row, col));
    cell.addEventListener('contextmenu', e => { e.preventDefault(); toggleFlag(row, col); });
    cell.addEventListener('touchstart', e => {
      longPressTimer = setTimeout(() => { e.preventDefault(); toggleFlag(row, col); }, 500);
    }, {passive:true});
    cell.addEventListener('touchend', () => clearTimeout(longPressTimer));
    cell.setAttribute('aria-label', `セル ${row+1}行 ${col+1}列`);
    grid.appendChild(cell);
  }
}

function openCell(r, c) {
  if (gameOver || won || flagged[r][c] || revealed[r][c]) return;
  hintCells = [];

  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    timerInterval = setInterval(() => {
      seconds++;
      document.getElementById('timerEl').textContent = seconds;
    }, 1000);
  }

  if (board[r][c] === -1) {
    revealed[r][c] = true;
    gameOver = true;
    clearInterval(timerInterval);
    revealAllMines();
    document.getElementById('statusMsg').textContent = '💥 ゲームオーバー！';
    document.getElementById('statusMsg').className = 'text-red-400 font-black';
    renderGrid();
    return;
  }

  floodReveal(r, c);
  checkWin();
  renderGrid();
}

function floodReveal(r, c) {
  if (r<0||r>=gridSize||c<0||c>=gridSize||revealed[r][c]||flagged[r][c]) return;
  revealed[r][c] = true;
  if (board[r][c] === 0) {
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) {
      if (dr!==0||dc!==0) floodReveal(r+dr, c+dc);
    }
  }
}

function revealAllMines() {
  for (let r=0;r<gridSize;r++) for (let c=0;c<gridSize;c++) {
    if (board[r][c]===-1) revealed[r][c] = true;
  }
}

function toggleFlag(r, c) {
  if (gameOver || won || revealed[r][c]) return;
  flagged[r][c] = !flagged[r][c];
  updateMineCounter();
  renderGrid();
}

function updateMineCounter() {
  let flagCount = 0;
  for (let r=0;r<gridSize;r++) for (let c=0;c<gridSize;c++) if(flagged[r][c]) flagCount++;
  document.getElementById('mineCounter').textContent = totalMines - flagCount;
}

function checkWin() {
  let unopened = 0;
  for (let r=0;r<gridSize;r++) for (let c=0;c<gridSize;c++) if(!revealed[r][c]) unopened++;
  if (unopened === totalMines) {
    won = true;
    clearInterval(timerInterval);
    document.getElementById('statusMsg').textContent = '🎉 クリア！ ' + seconds + 's';
    document.getElementById('statusMsg').className = 'text-green-400 font-black';
  }
}

function showHint() {
  if (gameOver || won || firstClick) return;
  hintCells = [];

  for (let r=0;r<gridSize;r++) for (let c=0;c<gridSize;c++) {
    if (!revealed[r][c] || board[r][c] <= 0) continue;

    const neighbors = [];
    let flagCount = 0;
    for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++) {
      if (dr===0&&dc===0) continue;
      const nr=r+dr,nc=c+dc;
      if (nr<0||nr>=gridSize||nc<0||nc>=gridSize) continue;
      if (!revealed[nr][nc]) {
        if (flagged[nr][nc]) flagCount++;
        else neighbors.push([nr,nc]);
      }
    }

    if (flagCount === board[r][c] && neighbors.length > 0) {
      neighbors.forEach(([nr,nc]) => {
        if (!hintCells.some(([hr,hc])=>hr===nr&&hc===nc)) hintCells.push([nr,nc]);
      });
    }
  }

  if (hintCells.length === 0) {
    document.getElementById('statusMsg').textContent = '💡 論理的に安全なセルなし';
    document.getElementById('statusMsg').className = 'text-yellow-400';
  } else {
    document.getElementById('statusMsg').textContent = '💡 ' + hintCells.length + 'セルが安全！';
    document.getElementById('statusMsg').className = 'text-yellow-300 font-bold';
  }
  renderGrid();
}

newGame();
</script>
</body>
</html>
